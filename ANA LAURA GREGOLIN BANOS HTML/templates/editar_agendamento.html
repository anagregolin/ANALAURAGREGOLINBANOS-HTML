{% extends "base.html" %}{% block content %}<h1>Atualizar agendamento</h1><p class="subtitulo">Altere a data e o horário do agendamento selecionado.</p>
<form class="formulario" method="post"><label>Nova data e hora *</label><input type="datetime-local" name="data_hora" required value="{{ agendamento.data_hora }}">
<div class="acoes"><button>Salvar alteração</button><a class="botao secundario" href="{{ url_for('agendamentos') }}">Cancelar</a></div></form>{% endblock %}
